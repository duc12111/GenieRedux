# @package _global_
# 256x256 resolution data generation preset

defaults:
  - /connector@connector: retro_act
  - _self_

# Output under data_generation/datasets when run from data_generation
data_dpath: datasets/

connector:
  image_size: [256, 256]
  variant: random
  limit_games: 200
  annotation_control_fpath: null
  generator_config:
    n_instances: 1
    n_sessions: 50
    n_steps_max: 500
    n_workers: 10
    output_mode: frame

dname: g200_256
